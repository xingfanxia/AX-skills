[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apple-photos-skill"
version = "0.2.0"
description = "Safety-oriented Apple Photos CLI and agent skill"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Apple Photos Skill contributors"}]
keywords = ["apple-photos", "photokit", "osxphotos", "agent-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
photos = ["osxphotos==0.76.1; sys_platform == 'darwin'"]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
apple-photos = "apple_photos_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_photos_cli"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "apple_photos_cli/schemas"
"skills/apple_photos.md" = "apple_photos_cli/bundled/skills/apple_photos.md"
"native/PhotoKitHelper" = "apple_photos_cli/bundled/native/PhotoKitHelper"
"docs" = "apple_photos_cli/bundled/docs"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["live: opt-in test that may access a disposable System Photo Library"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
